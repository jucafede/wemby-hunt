  # --- EU : références de prix, NON CRAWLÉES dans cette version ------------------------------
  # Hiérarchie d'achat EU pour les produits Topps :
  #   1) fr.topps.com au MSRP à la release — preuves : Chrome Black 360 € contre une présale US
  #      à 719,95 $ ; Update Value 45 € contre un sold US de 57,50 $
  #   2) tracenchase — revendeur officiel, stock le jour de la sortie, DHL offert dès 299 €
  #   3) TAASS / shopuscards — revendeurs, prime de commodité
  # Toute nouvelle sortie Topps se compare à 1) et 2) AVANT de regarder le marché US.
  # Les deux entrées ci-dessous rejoignent la file du futur collecteur html, avec DACW,
  # Steel City, Blowout et Mill Creek. Aucun crawl ici.
  - key: shopuscards
    name: ShopUScards
    base_url: https://shopuscards.eu
    url: https://shopuscards.eu
    type: html                    # premier client du collecteur HTML (adaptateur du 30/08)
    platform: ecwid               # ec-instant-site, boutique 32676041 — fiches en schema.org
    market_region: FR
    currency: EUR
    robots_checked_at: 2026-08-30
    robots_note: "aucune directive visant notre agent ; seules les pages panier/compte/paiement sont interdites. Collecte via le sitemap publié."
    country: FR
    ships_from: FR
    free_shipping_threshold_eur: 35   # Mondial Relay France
    payment: paypal (x4 possible)
    price_display_warning: "prix affichés probablement HT (quasi tous ×1,2 = rond) — TOUT relevé doit être confirmé TTC au checkout avant usage décisionnel"
    trust: watch
    notes: "revendeur FR depuis 2020, catalogue large 23-24→25-26 + cases + EuroLeague. Rôle: baromètre fr_price_eur."
  - key: tracenchase
    name: Trace 'n Chase
    base_url: https://tracenchase.com
    url: https://tracenchase.com
    type: eu_reference
    platform: woocommerce         # client du futur collecteur html
    country: GR
    ships_from: GR
    free_shipping_threshold_eur: 299   # DHL Express UE
    official_retailer: [panini, topps, upper_deck, fanatics]
    release_day_stock: true
    promo_note: "-10% sitewide auto jusqu'au 2026-08-31 (+ code TRACE5+10 affiché 15%, à tester)"
    trust: watch
    notes: "gros acteur EU, Thessalonique, boutique physique, Trustpilot. Rôle: canal d'achat EU n°2 derrière fr.topps.com + source fr_price_eur."
  # --- MARCHÉ FR : vendeurs français crawlés, market_region: FR ------------------------------
  # Ce sont des CANAUX D'ACHAT, pas une base de ventes réalisées. Leurs prix ne deviennent
  # jamais market_sold_us, market_ask_us, ni une valeur de marché. Ils répondent uniquement à
  # « quel est le meilleur prix achetable en France aujourd'hui ? ».
  # Devise native EUR conservée telle quelle : aucune conversion dans l'observation brute.
  - {key: qscards, name: QS Cards, base_url: https://qscards.com, type: shopify_json,
     market_region: FR, currency: EUR, country: FR, trust: watch, status: watch,
