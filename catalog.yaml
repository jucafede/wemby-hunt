# Catalogue canonique — les SKU que le moteur a le DROIT de comparer.
# Tout produit non rattaché avec confiance >= 0.80 va dans products_raw uniquement (REVIEW).
# Prix marché : market_ask_us = prix affiché (WaxStat/shops), market_sold_us = ventes réalisées (SportsCardsPro/eBay sold).
# Le seuil buy_below_usd doit être ≤ market_sold_us. Saisis à la main, datés. Mets à jour 1×/semaine.
# Provenance de market_sold_us : market_sold_source = stockx | sportscardspro | ebay_sold | manual, + market_sold_checked_at.
# ATTENTION StockX : le prix retail/MSRP affiché n'est PAS une vente. Seule une "Last Sale" alimente market_sold_us.
fx_usd_eur: 0.862

landed_cost:                # hypothèses provisoires → coût rendu ESTIMÉ DANS UN PANIER TYPE DE bundle_boxes boîtes. À remplacer par tes chiffres MyUS réels.
  bundle_boxes: 8
  domestic_shipping_usd: 0.0        # la plupart des LCS offrent le port > 50-100 $
  forwarder_fee_usd_per_box: 3.0    # MyUS traitement/consolidation, à affiner
  intl_shipping_usd_per_box: 9.0    # DHL, hypothèse pour ~8 blasters consolidés
  vat_rate: 0.20
  customs_flat_eur_per_category: 3.0
  customs_categories: 1

