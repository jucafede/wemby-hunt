name: wemby-discover
on:
  schedule:
    - cron: "0 5 * * 1"      # tous les lundis 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prospection
        shell: bash
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # absent → bascule automatique sur DuckDuckGo
        run: |
          set -o pipefail
          # étalé en 3 lots de 10 SKU avec pauses : DuckDuckGo bloque l'IP au-delà d'une
          # quarantaine de requêtes rapprochées (constaté le 18/08 en local, HTTP 403).
          python discover.py --offset 0  --limit 10 --sleep 5            | tee    discover_log.txt
          sleep 120
          python discover.py --offset 10 --limit 10 --sleep 5 --merge    | tee -a discover_log.txt
          sleep 120
          python discover.py --offset 20 --limit 10 --sleep 5 --merge    | tee -a discover_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: |
            discovered/
            discover_log.txt
      # Le fragment est commité : la page le reprend au prochain passage de wemby-hunt.
      # sources.yaml n'est jamais touché — l'ajout d'une source reste une décision humaine.
      - name: Commit des candidats
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discovered/
          git diff --staged --quiet || git commit -m "discover: candidats du $(date -u +%Y-%m-%d)"
          git push
