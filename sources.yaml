# Registre des shops. type: shopify_json | html (collecteur v2 → skip) | breaks (breaker, hors périmètre sealed → skip)
# trust: trusted (défaut si absent) | watch (lignes marquées 👀 VERIFY) | high_risk (observé, jamais GO ni BEST, ⚠️ VERIFY SELLER)
#        trust n'est PAS un score : il ne pondère rien, il ne fait qu'étiqueter et, pour high_risk, retirer du classement.
# priority: indicatif humain, le moteur n'en tient pas compte.
