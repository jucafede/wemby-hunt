# ─────────────────────────────────────────────────────────────────────────────
#  INVENTAIRE — ce que je détiens réellement
# ─────────────────────────────────────────────────────────────────────────────
#
#  Ce fichier est une SOURCE DE VÉRITÉ HUMAINE, au même titre que catalog.yaml.
#  Le moteur le lit, ne l'écrit jamais.
#
#  RÈGLE CARDINALE — l'inventaire n'influence AUCUN verdict de marché.
#  Ce que je possède ne change pas ce qu'un produit vaut. Mêler les deux créerait
#  une circularité : mon coût d'achat deviendrait une référence de prix, et le
#  radar finirait par se recommander à lui-même. L'inventaire s'AFFICHE à côté
#  du verdict, jamais dedans.
#
#  Conséquence assumée : une ligne déjà en stock reste visible et gardera son
#  ASK DEAL. Un restock à -60 % peut valoir un rachat — c'est ma décision, pas
#  celle du moteur. Le badge « 📦 EN STOCK ×N » informe, il ne bloque pas.
#
#  Fichier absent ou vide = le radar fonctionne exactement comme avant.
#
#  Inventaire réel au 30/08/2026. Coûts CONSTATÉS (produit + part de port + part d'import).
#  Cardiacs et Hidden Gems : import MyUS ESTIMÉ à 340 € pour 35 unités, inclus dans le landed —
#  à remplacer par la facture DHL dès qu'elle arrive. Blowout porte un import UPS RÉEL.
#  Exclus volontairement : la carte Panini Instant Wemby (collection personnelle) et deux
#  Donruss Fat-Packs — ce ne sont pas des boîtes scellées.
#
# ─────────────────────────────────────────────────────────────────────────────
#  CHAMPS
# ─────────────────────────────────────────────────────────────────────────────
#
#  sku               obligatoire · doit exister dans catalog.yaml. Un sku inconnu
#                    est signalé au rapport et ignoré — jamais deviné, jamais créé
#                    en silence. C'est ce qui relie une boîte physique à un marché.
#
#  qty               obligatoire · entier > 0 · nombre de BOÎTES, jamais de cases.
#                    Une case de 20 achetée se saisit qty: 20 sur le SKU boîte,
#                    pas qty: 1 sur le SKU case — sinon le landed unitaire ment.
#
#  unit_landed_eur   obligatoire · coût rendu RÉEL par boîte, en euros, tout compris
#                    (prix + port US + transitaire + port international + TVA +
#                    douane). C'est un montant CONSTATÉ, pas l'estimation calculée
#                    par landed_eur() — la doctrine dit qu'une valeur réelle
#                    remplace toujours une hypothèse.
#
#  order_ref         obligatoire · référence de commande, telle qu'elle figure chez
#                    le vendeur. C'est la pièce justificative : sans elle, une ligne
#                    d'inventaire est une affirmation, pas un fait.
#
#  ordered_at        obligatoire · date de commande (AAAA-MM-JJ). Sert à mesurer le
#                    temps de transit réel et l'âge du stock dormant.
#
#  status            obligatoire · une seule valeur parmi :
#                      ordered       commandé, pas encore expédié
#                      at_forwarder  arrivé chez le transitaire, pas encore en France
#                      received      chez moi, scellé
#                      opened        ouvert (sort du stock scellé — ne se revend plus tel quel).
#                                    Une boîte ouverte n'est pas sortie du business : elle est
#                                    convertie en singles ou en spots de break. Le P&L la
#                                    retrouvera par sold_price_eur au niveau du break, pas de
#                                    la boîte — reste à construire.
#                      listed        en vente
#                      sold          vendu (conservé pour le P&L, hors stock courant)
#                    Seuls ordered / at_forwarder / received comptent comme
#                    « possédé scellé » et déclenchent le badge sur les cartes.
#
#  ─── facultatifs ───
#  shop              vendeur d'origine, pour recouper avec les observations du radar
#  note              tout ce qui ne rentre nulle part ailleurs
#  sold_price_eur    prix de vente réel · À NE REMPLIR QUE sur status: sold.
#                    Première brique du P&L réalisé : c'est la donnée que personne
#                    d'autre n'a et que la doctrine nomme comme l'atout du projet.
#  sold_at           date de vente (AAAA-MM-JJ) · idem
#
# ─────────────────────────────────────────────────────────────────────────────
#  CE QUE LE RADAR EN FAIT
# ─────────────────────────────────────────────────────────────────────────────
#  1. Badge « 📦 EN STOCK ×N · 44,15 €/boîte » sur toute carte ACHETER ou
#     SURVEILLER dont le SKU figure ici en ordered / at_forwarder / received.
#  2. Section « 📦 Mon inventaire », entre Surveiller et le marché FR : par SKU,
#     qty · landed/u · meilleur ask US actuel · sold si connu · écart vs mon coût.
#  3. Un SKU inventorié sans aucune observation de marché s'affiche « — ».
#     Aucune valeur n'est inventée pour combler un trou.
#
#  Les montants sont en euros (mon coût) face à des dollars (le marché US).
#  Aucune conversion silencieuse : chaque colonne porte sa devise.
# ─────────────────────────────────────────────────────────────────────────────

